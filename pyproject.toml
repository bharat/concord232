[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest"
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "concord232.egg-info",
    "__pycache__",
]

[tool.ruff.lint]
# Pre-existing debt, ignored deliberately so CI stays green while it is
# worked down. Each of these needs case-by-case judgment rather than an
# automated fix; remove entries from this list as the code is cleaned up.
ignore = [
    "UP031",   # printf-style string formatting, 40+ sites
    "DTZ005",  # naive datetime.now(), needs a timezone audit
    "RUF012",  # mutable class defaults, needs ClassVar annotations
    "BLE001",  # blind except in serial and HTTP retry loops
    "PLW1510", # subprocess.run without check=
    "S110",    # try-except-pass
    "SIM115",  # open() outside a context manager
    "SIM401",  # false positive on ConfigParser: get(section, option) is not dict.get; the autofix crashed the server at startup on 2026-09-22
    "YTT301",  # sys.version[0] in the legacy status_p3.py script
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
skip = [".venv", "concord232.egg-info", "__pycache__"]

[tool.setuptools.packages.find]
where = ["."]
include = ["concord232*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.mkdocs]
# MkDocs configuration section (if not present)

[project]
name = "concord232"
version = "0.16.8"
description = "GE Concord 4 RS232 Serial Interface Library and Server"
authors = [
    { name = "Jason Carter", email = "jason@jason-carter.net" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.6"
dependencies = [
    "requests",
    "stevedore",
    "prettytable",
    "pyserial",
    "flask",
    "paho-mqtt>=1.6.1,<2",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9"
]
urls = { "Homepage" = "http://github.com/JasonCarter80/concord232" }

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.scripts]
concord232_server = "concord232.main:main"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
pretty = true